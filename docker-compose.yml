version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: notifyhub_postgres
    environment:
      POSTGRES_USER: notifyhub
      POSTGRES_PASSWORD: notifyhub123
      POSTGRES_DB: notifyhub_db
    ports:
      - "5432:5432"
    volumes:
      - notifyhub_pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - notifyhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifyhub -d notifyhub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: notifyhub_redis
    ports:
      - "6379:6379"
    networks:
      - notifyhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifyhub-api:
    build:
      context: .
      dockerfile: NotifyHub.API/Dockerfile
    container_name: notifyhub_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=notifyhub_db;Username=notifyhub;Password=notifyhub123
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=NotifyHub-SuperSecret-Key-MinimumOf32Characters!
      - Jwt__Issuer=NotifyHub
      - Jwt__Audience=NotifyHubUsers
      - Jwt__AccessTokenExpiryMinutes=15
      - Jwt__RefreshTokenExpiryDays=7
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notifyhub-network

  notifyhub-web:
    build:
      context: ./NotifyHub.Web
      dockerfile: Dockerfile
    container_name: notifyhub_web
    ports:
      - "4200:80"
    depends_on:
      - notifyhub-api
    networks:
      - notifyhub-network

networks:
  notifyhub-network:
    driver: bridge

volumes:
  notifyhub_pgdata:
