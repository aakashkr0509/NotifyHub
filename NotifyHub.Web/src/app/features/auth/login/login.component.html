<div class="login-container">
  <div class="login-card">
    <h2>NotifyHub</h2>
    <p class="subtitle">Sign in to your workspace</p>

    <div class="error-msg" *ngIf="error">
      {{ error }}
    </div>

    <div class="form-group">
      <label>Subdomain</label>
      <input type="text" [(ngModel)]="subdomain" placeholder="acme" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="admin@acme.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <button class="btn-login" [disabled]="loading" (click)="onSubmit()">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>
  </div>
</div>
